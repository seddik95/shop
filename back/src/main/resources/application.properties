server.port=8080
spring.datasource.url=jdbc:h2:file:./data/shopdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Override in production via env var APP_JWT_SECRET (>= 32 chars)
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl-minutes=120
app.admin-email=admin@admin.com
app.cors.allowed-origin=http://localhost:4200
